    <section class="stats-summary"><div class="stat-hero-card"><small>作品总数</small><strong id="stat-total">—</strong></div><div class="stat-hero-card"><small>EXIF 覆盖</small><strong id="stat-exif">—</strong></div><div class="stat-hero-card"><small>主要机身</small><strong id="stat-camera">—</strong></div><div class="stat-hero-card"><small>中位焦段</small><strong id="stat-focal">—</strong></div></section>
