<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>咸鱼桑 — 摄影档案</title>
  <link rel="stylesheet" href="assets/css/site.css?v=4">
</head>
<body data-page="home" class="home-jason-layout">
  <div class="cinematic-loader" aria-hidden="true"><div class="loader-mark"><i>咸</i>鱼桑</div><div class="loader-time" data-loader-time></div></div>
  <div class="film-grain" aria-hidden="true"></div>
  <div class="home-film-rails" aria-hidden="true"><span></span><span></span></div>
  <div class="page-wipe" aria-hidden="true"></div><div class="cursor-dot"></div><div class="cursor-ring"></div>

  <header class="site-header home-header">
    <a class="site-brand" href="#top"><span data-site-name>咸鱼桑</span><small data-site-subtitle>摄影档案</small></a>
    <button class="home-creative-toggle" type="button" data-creative-toggle>动效 OFF</button>
    <nav class="home-nav" aria-label="主导航">
      <a href="#work">作品</a>
      <a href="archive.html" data-transition>档案</a>
      <a href="stats.html" data-transition>数据</a>
      <a href="about.html" data-transition>关于</a>
      <a href="admin.html" data-transition>管理</a>
    </nav>
    <button class="mobile-menu-button" type="button" aria-label="菜单" aria-expanded="false" data-mobile-menu-button>≡</button>
  </header>
  <div class="mobile-menu" data-mobile-menu><nav><a href="#work">作品</a><a href="archive.html">档案</a><a href="stats.html">数据</a><a href="about.html">关于</a><a href="admin.html">管理</a></nav></div>

  <main>
    <section id="top" class="cinema-hero">
      <div id="home-hero-bg" class="cinema-hero-bg"></div><div class="cinema-vignette"></div>
      <div class="cinema-hero-kicker">PHOTOGRAPHER / PERSONAL ARCHIVE</div>
      <h1 class="cinema-hero-title" data-home-title><span class="accent-char">咸</span>鱼桑</h1>
      <div class="cinema-hero-labels"><span>PORTRAIT</span><span>EVENT</span><span>MEMORY</span></div>
      <div class="cinema-hero-bottom"><div>PRIVATE VISUAL MEMORY</div><div class="cinema-scroll-cue">浏览摄影集</div><div><span data-location>中国</span><br><span data-global-count>读取中</span></div></div>
    </section>

    <section id="work" class="home-work">
      <div class="home-work-head">
        <div><div class="eyebrow">个人摄影档案 / Collections</div><h2><i>作</i>品 / 精选</h2></div>
        <div class="home-view-switch" role="group" aria-label="作品浏览方式"><button type="button" class="is-active" data-home-view="slider">滑动</button><button type="button" data-home-view="list">列表</button></div>
      </div>
      <div id="home-project-slider" class="home-project-slider" tabindex="0" aria-label="摄影集横向浏览"><div class="home-loading">正在读取摄影集…</div></div>
      <div class="home-slider-help"><span>拖动 / 触控板 / 滚轮</span><span id="home-project-count">—</span><span>继续 →</span></div>
      <div id="home-project-list" class="home-project-list" hidden></div>
      <div id="home-list-preview" class="home-list-preview" aria-hidden="true"><img alt="摄影集预览"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js?v=1"></script><script src="assets/js/supabase-client.js?v=1"></script><script src="assets/js/site.js?v=4"></script><script src="assets/js/archive-data.js?v=4"></script>

</html>
