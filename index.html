<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Cinematic Photo Archive</title>
  <link rel="stylesheet" href="assets/css/site.css?v=21">
</head>
<body data-page="home" class="home-jason-layout">
  <div class="cinematic-loader" aria-hidden="true"><div class="loader-mark" data-english-name>XIAN YU SANG</div><div class="loader-time" data-loader-time></div></div>
  <div class="film-grain" aria-hidden="true"></div>
  <div class="home-film-rails" aria-hidden="true"><span></span><span></span></div>
  <div class="page-wipe" aria-hidden="true"></div><div class="cursor-dot"></div><div class="cursor-ring"></div>

  <header class="site-header home-header">
    <a class="site-brand" href="#top"><span data-english-name>XIAN YU SANG</span><small>PHOTO ARCHIVE</small></a>
    <nav class="home-nav" aria-label="Primary navigation">
      <a href="#work">WORK</a>
      <a href="archive.html" data-transition>ARCHIVE</a>
      <a href="stats.html" data-transition>DATA</a>
      <a href="about.html" data-transition>ABOUT</a>
    </nav>
    <div class="home-header-tools">
      <button class="home-creative-toggle" type="button" data-creative-toggle>CREATIVE OFF</button>
      <a href="admin.html" data-transition>MANAGE</a>
    </div>
    <button class="mobile-menu-button" type="button" aria-label="Menu" aria-expanded="false" data-mobile-menu-button>≡</button>
  </header>
  <div class="mobile-menu" data-mobile-menu><nav><a href="#work">WORK</a><a href="archive.html">ARCHIVE</a><a href="stats.html">DATA</a><a href="about.html">ABOUT</a><a href="admin.html">MANAGE</a></nav></div>

  <main>
    <section id="top" class="cinema-hero">
      <div id="home-hero-bg" class="cinema-hero-bg"></div><div class="cinema-vignette"></div>
      <div class="cinema-hero-kicker">PHOTOGRAPHER / PERSONAL ARCHIVE</div>
      <h1 class="cinema-hero-title" data-home-title><span class="accent-char">X</span>IAN YU SANG</h1>
      <div class="cinema-hero-labels"><span>PORTRAIT</span><span>EVENT</span><span>MEMORY</span></div>
      <div class="cinema-hero-bottom"><div>PRIVATE VISUAL MEMORY</div><div class="cinema-scroll-cue">EXPLORE COLLECTIONS</div><div><span data-location>中国</span><br><span data-global-count>读取中</span></div></div>
    </section>

    <section id="work" class="home-work">
      <div class="home-work-head">
        <div><div class="eyebrow">PERSONAL PHOTO ARCHIVE</div><h2><i>W</i>ORK / SELECTED</h2></div>
        <div class="home-view-switch" role="group" aria-label="作品浏览方式"><button type="button" class="is-active" data-home-view="slider">SLIDER</button><button type="button" data-home-view="list">LIST</button></div>
      </div>
      <div id="home-project-slider" class="home-project-slider" tabindex="0" aria-label="摄影集横向浏览"><div class="home-loading">正在读取摄影集…</div></div>
      <div class="home-slider-help"><span>DRAG / TRACKPAD / WHEEL</span><span id="home-project-count">—</span><span>NEXT →</span></div>
      <div id="home-project-list" class="home-project-list" hidden></div>
      <div id="home-list-preview" class="home-list-preview" aria-hidden="true"><img alt="摄影集预览"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js?v=1"></script><script src="assets/js/supabase-client.js?v=9"></script><script src="assets/js/site.js?v=20"></script><script src="assets/js/archive-data.js?v=21"></script>
</body>
</html>
